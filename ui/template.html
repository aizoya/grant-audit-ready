<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit-Ready · Single Audit readiness check</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8ebf1;--mut:#8a93a6;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ff6b6b;--acc:#7aa2ff}
@media(prefers-color-scheme:light){:root{--bg:#f6f7fa;--card:#fff;--line:#e3e6ee;--tx:#14171f;--mut:#667085;--ok:#12805c;--warn:#a96a00;--bad:#c23030;--acc:#2f5bd8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.cost{display:flex;gap:10px;margin:16px 0}.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.pill b{display:block;font-size:20px}.pill span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.f{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:14px;margin:12px 0}
.f.likely{border-left-color:var(--bad)}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.f h3{margin:2px 0 6px;font-size:16px}.q{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:13px/1.4 ui-monospace,Menlo,monospace}
.q small{display:block;color:var(--acc);margin-bottom:2px}.ok{color:var(--ok);font-size:14px}.none{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
.disc{color:var(--mut);font-size:12px;margin-top:22px}h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 6px}
</style></head><body><div class="wrap">
<h1>Audit-Ready</h1><div class="sub">Single Audit readiness check · synthetic demo data · no live model calls</div>
<select id="s"></select>
<div class="cost"><div class="pill"><span>Run cost</span><b id="c1"></b></div><div class="pill"><span>Verified findings</span><b id="c2"></b></div><div class="pill"><span>Dropped (unverified)</span><b id="c3"></b></div></div>
<div id="out"></div><h2>Checks passed</h2><div id="pass" class="ok"></div><div class="disc" id="d"></div></div>
<script>
const D=__DATA__,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
D.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;$('s').appendChild(o)});
function draw(){const x=D[$('s').value],r=x.report;
$('c1').textContent='$'+r.cost_usd.toFixed(5);$('c2').textContent=r.findings.length;$('c3').textContent=r.dropped_unverified;
$('out').innerHTML=r.findings.length?r.findings.map(f=>`<div class="f ${f.severity}"><div class="tag">${esc(f.code)} · ${f.severity==='likely'?'likely issue':'needs review'}</div><h3>${esc(f.message)}</h3>${f.evidence.map(e=>`<div class="q"><small>${esc(e.doc)} · page ${e.page} · verified verbatim</small>${esc(e.quote)}</div>`).join('')}</div>`).join(''):'<div class="none">No findings with verified evidence. Anything the model claimed without an exact quote was dropped, not shown.</div>';
$('pass').textContent=r.passed_checks.length?r.passed_checks.join(' · '):'none';$('d').textContent=r.disclaimer}
$('s').onchange=draw;draw();
</script></body></html>
